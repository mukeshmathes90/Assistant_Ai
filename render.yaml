# Render Blueprint: one free web service running the whole system
# (React frontend + FastAPI backend + Gemini AI) from the Dockerfile.
services:
  - type: web
    name: nandha-admission-assistant
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: GEMINI_API_KEY
        sync: false          # paste your key in the Render dashboard
      - key: DATABASE_URL
        sync: false          # free Postgres URL from neon.tech (keeps data across restarts)
      - key: SECRET_KEY
        generateValue: true
      - key: COLLEGE_NAME
        value: Nandha Engineering College (Autonomous)
      - key: COLLEGE_WEBSITE
        value: https://nandhaengg.org/
      # WhatsApp Cloud API (primary channel)
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_BUSINESS_NUMBER
        sync: false
      # Telegram bot (alternative channel)
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_POLLING
        value: "1"
